name: Discord Notification

on:
  push:
    branches:
      - master
    paths-ignore:
      - ".github/**"
      - ".gitignore"
      - ".gitattributes"
      - ".luacheckrc"
      - "config.ld"
      - "README.md"
      - "LICENSE"
      - "Rotations/Old/**"
      - "Rotations/sample rotation.lua"
      - "System/API/**" # Temp Ignore API Folder

jobs:
  Discord_notification:
    runs-on: ubuntu-latest
    steps:
      # A push whose newest commit message starts with "[announce]" also posts that message as an announcement,
      # before the usual commit list. First line: "[announce] <title>"; the lines after it are the text.
      - name: Post announcement
        if: startsWith(github.event.head_commit.message, '[announce]')
        continue-on-error: true
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          COMPARE_URL: ${{ github.event.compare }}
          WEBHOOK_ID: ${{ secrets.DISCORD_WEBHOOK_ID }}
          WEBHOOK_TOKEN: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
        run: |
          title=$(printf '%s\n' "$MESSAGE" | head -n 1 | sed -E 's/^\[announce\][[:space:]]*//')
          body=$(printf '%s\n' "$MESSAGE" | tail -n +2)
          jq -n --arg title "$title" --arg body "$body" --arg url "$COMPARE_URL" \
            '{embeds: [{title: ($title | .[0:256]), description: ($body | ltrimstr("\n") | .[0:4096]),
                        url: $url, color: 47906}]}' > payload.json
          # Retry only when Discord didn't take the message (no connection, 429, 500, 502, 503). A 504 (or any
          # other answer) may still have posted it, so it isn't retried: a retry could post it twice.
          for attempt in 1 2 3; do
            status=$(curl -sS -o response.txt -w '%{http_code}' -H "Content-Type: application/json" \
              -d @payload.json "https://discord.com/api/webhooks/${WEBHOOK_ID}/${WEBHOOK_TOKEN}") || status=000
            case "$status" in
              2??) echo "Announcement posted."; exit 0 ;;
              000|429|500|502|503) echo "Discord answered $status (attempt $attempt), retrying."; sleep $((attempt * 5)) ;;
              4??) echo "::warning::Discord refused the announcement ($status)."; cat response.txt; exit 1 ;;
              *) echo "::warning::Discord answered $status: the announcement may or may not have posted. Check Discord."
                 cat response.txt; exit 1 ;;
            esac
          done
          echo "::warning::The announcement wasn't posted after 3 attempts."; exit 1

      - name: Run Discord Webhook
        uses: mrrobotdotapp/classic-discord-webhook@fa1d534b6622185421d94da8faeced03ae7d99eb # main
        with:
          id: ${{ secrets.DISCORD_WEBHOOK_ID }}
          token: ${{ secrets.DISCORD_WEBHOOK_TOKEN }}
          # threadId is optional and only if you want to post in a specific thread
          # threadId: ${{ secrets.DISCORD_WEBHOOK_THREAD_ID }}
